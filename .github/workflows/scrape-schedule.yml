name: Зібрати розклад з UniHub

# Тільки вручну: Actions → "Зібрати розклад з UniHub" → Run workflow.
# Розклад змінюється раз на семестр, тому запуск за таймером тут зайвий —
# і поламку видно одразу, бо ти сам дивишся на результат запуску.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Скільки груп зібрати (порожньо = усі; для перевірки постав 3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Встановити Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Зібрати розклад
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            node tools/scrape-schedule.mjs --limit ${{ inputs.limit }}
          else
            node tools/scrape-schedule.mjs
          fi

      # Збір триває понад десять хвилин, тож результат зберігаємо окремо
      # ще до спроби коміту: якщо push не пройде, дані все одно можна буде
      # забрати з артефактів, а не збирати заново.
      - name: Зберегти результат як артефакт
        uses: actions/upload-artifact@v4
        with:
          name: unihub-schedule
          path: schedule/unihub.json
          retention-days: 7

      - name: Закомітити результат
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # package.json/package-lock від npm install у коміт не потрапляють.
          git add schedule/unihub.json
          if git diff --staged --quiet; then
            echo "Розклад не змінився — коміт не потрібен."
            exit 0
          fi
          git commit -m "Оновити розклад з UniHub"
          # За десять хвилин збору гілка встигає піти вперед, і push тоді
          # відхиляється. Підтягуємо чуже й пробуємо ще раз.
          for attempt in 1 2 3; do
            if git push; then
              echo "Запушено з $attempt спроби."
              exit 0
            fi
            echo "Push відхилено — підтягую зміни й пробую знову."
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          done
          echo "Не вдалося запушити після трьох спроб."
          exit 1
